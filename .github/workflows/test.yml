name: Testler
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sözdizimi kontrolü
        run: |
          node --check app.js
          for f in api/*.js scripts/*.mjs; do node --check "$f"; done
      - name: vercel.json geçerli JSON mu
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: Birim testleri
        run: npm test
